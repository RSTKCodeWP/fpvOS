<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="t d">
  <title id="t">Install fpvOS in three steps</title>
  <desc id="d">Flash a microSD card, put it in the goggle and power on, then fly. Pull the card to go back to stock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b28"/>
      <stop offset="1" stop-color="#0a121b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172637"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>
  </defs>
  <style>
    .t  { font: 700 25px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f2f7fb; }
    .s  { font: 400 16px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #9db3c6; }
    .n  { font: 800 18px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a121b; }
    .f  { font: 600 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #7fe08a; letter-spacing: 0.4px; }
    .ln { fill: none; stroke: #4fd1e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .ac { fill: none; stroke: #8be36f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1200" height="290" rx="22" fill="url(#bg)"/>

  <!-- step 1: microSD -->
  <g transform="translate(24 24)">
    <rect width="352" height="242" rx="16" fill="url(#card)" stroke="#233a50"/>
    <circle cx="36" cy="38" r="17" fill="#4fd1e8"/><text class="n" x="36" y="44.5" text-anchor="middle">1</text>
    <g transform="translate(246 18)">
      <path class="ln" d="M12 6 H52 L64 18 V86 a6 6 0 0 1 -6 6 H12 a6 6 0 0 1 -6 -6 V12 a6 6 0 0 1 6 -6 Z"/>
      <path class="ln" d="M20 6 V26 M31 6 V26 M42 6 V26"/>
      <path class="ac" d="M22 62 L32 72 L50 50"/>
    </g>
    <text class="t" x="28" y="148">Flash a microSD card</text>
    <text class="s" x="28" y="178">balenaEtcher writes it straight from</text>
    <text class="s" x="28" y="201">the downloaded .img.xz. No unpacking.</text>
    <text class="f" x="28" y="227">ANY CARD 2 GB OR LARGER</text>
  </g>

  <!-- arrow -->
  <path class="ln" d="M392 145 L404 145 M398 138 L405 145 L398 152"/>

  <!-- step 2: goggle -->
  <g transform="translate(424 24)">
    <rect width="352" height="242" rx="16" fill="url(#card)" stroke="#233a50"/>
    <circle cx="36" cy="38" r="17" fill="#4fd1e8"/><text class="n" x="36" y="44.5" text-anchor="middle">2</text>
    <g transform="translate(224 18)">
      <rect class="ln" x="2" y="14" width="100" height="62" rx="16"/>
      <circle class="ln" cx="30" cy="45" r="14"/>
      <circle class="ln" cx="74" cy="45" r="14"/>
      <path class="ln" d="M46 76 q6 -9 12 0"/>
      <path class="ac" d="M96 4 V14 M90 9 L96 3 L102 9"/>
    </g>
    <text class="t" x="28" y="148">Insert it, power on</text>
    <text class="s" x="28" y="178">The VRX Pro boots fpvOS from the card.</text>
    <text class="s" x="28" y="201">Nothing is written to the goggle itself.</text>
    <text class="f" x="28" y="227">PULL THE CARD: STOCK AGAIN</text>
  </g>

  <!-- arrow -->
  <path class="ln" d="M792 145 L804 145 M798 138 L805 145 L798 152"/>

  <!-- step 3: fly -->
  <g transform="translate(824 24)">
    <rect width="352" height="242" rx="16" fill="url(#card)" stroke="#233a50"/>
    <circle cx="36" cy="38" r="17" fill="#8be36f"/><text class="n" x="36" y="44.5" text-anchor="middle">3</text>
    <g transform="translate(236 18)">
      <circle class="ln" cx="14" cy="14" r="11"/>
      <circle class="ln" cx="78" cy="14" r="11"/>
      <circle class="ln" cx="14" cy="78" r="11"/>
      <circle class="ln" cx="78" cy="78" r="11"/>
      <path class="ln" d="M22 22 L38 38 M70 22 L54 38 M22 70 L38 54 M70 70 L54 54"/>
      <rect class="ac" x="36" y="36" width="20" height="20" rx="5"/>
    </g>
    <text class="t" x="28" y="148">Link up and fly</text>
    <text class="s" x="28" y="178">Works with your stock Ascent air unit.</text>
    <text class="s" x="28" y="201">Flash the fpvOS air image for more.</text>
    <text class="f" x="28" y="227">YOUR AIR UNIT STAYS AS IT IS</text>
  </g>
</svg>
